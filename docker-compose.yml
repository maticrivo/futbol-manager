services:
  db:
    image: postgres:17-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: futbol
      POSTGRES_PASSWORD: futbol
      POSTGRES_DB: futbol
      TZ: UTC
    volumes:
      - futbol-pg-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futbol -d futbol"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  futbol-pg-data:
