services:
  db:
    image: mysql:8.0
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: futbol
      MYSQL_USER: futbol
      MYSQL_PASSWORD: futbol
    volumes:
      - futbol-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
volumes:
  futbol-data:
